name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'

      - name: Fetch dependencies
        run: flutter pub get

      - name: Build arm64 release APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Rename arm64 APK
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk "DreamPlayer-0.5.7+11-arm64-v8a.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DreamPlayer-Official-APK
          path: build/app/outputs/flutter-apk/DreamPlayer-0.5.7+11-arm64-v8a.apk
