name: Build Test APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Pre-fetch Gradle Wrapper with Retry
        working-directory: android
        run: |
          for i in {1..3}; do
            ./gradlew --version && break || {
              echo "Gradle wrapper fetch attempt $i failed, retrying in 5s..."
              sleep 5
            }
          done

      - name: Build APK (Release mode)
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: flutter build apk --release

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DreamPlayer-test-apk
          path: build/app/outputs/flutter-apk/*.apk
